name: tests

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node tests/run.js

  # Regenerate the vectors with whatever Python this runner has, then run the
  # suite against those. Byte-comparing a committed file instead pins the repo
  # to one Python patch release: ipaddress changed both its is_private rules
  # and its IPv4-mapped rendering inside the 3.12 series, and CI failed on
  # vectors that were correct when generated.
  agrees-with-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Regenerate vectors and check the library still agrees
        run: |
          python tests/generate-vectors.py
          node tests/run.js
      - name: Show any drift from the committed vectors (informational)
        run: git --no-pager diff --stat -- tests/vectors.json
